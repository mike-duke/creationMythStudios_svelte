name: Deploy to GitHub Pages

on:
  # Deploy whenever you push to the main branch...
  push:
    branches: "main"
  # ...and allow manual runs from the Actions tab.
  workflow_dispatch:

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # The site is served from a custom domain (creationmythstudios.com),
          # so it lives at the root and the base path must be empty.
          #
          # If you ever revert to a project page at
          # https://<user>.github.io/<repo>/, set this back to
          # '/${{ github.event.repository.name }}'.
          BASE_PATH: ""
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Must match the `pages` option in svelte.config.js (adapter-static).
          path: "build/"

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    # Permissions required for GitHub Pages deployment.
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
